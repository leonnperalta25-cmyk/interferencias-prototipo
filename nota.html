<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Nota de respuesta | EPEN</title>
<meta name="theme-color" content="#2B3E4C">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<link rel="stylesheet" href="css/fuentes.css">
<link rel="stylesheet" href="css/epen.css">
<style>
  html, body { background: var(--gris-papel); }
  body { min-height: 100vh; font-size: 16px; }
</style>
</head>
<body class="solo-nota">
<a class="saltar" href="#nota">Saltar a la nota</a>

<div class="prototipo" role="note" aria-label="Aviso de prototipo">
<div class="contenedor prototipo__in">
<p><strong>Prototipo de propuesta.</strong> La nota se arma sola con el modelo del Sector Técnico y los datos del trámite.</p>
<div class="prototipo__acciones" data-acciones-prototipo></div>
</div>
</div>

<div class="barra-nota sobre-oscuro">
<div class="contenedor barra-nota__in">
<div style="min-width:0">
<p class="barra-nota__titulo">Nota de respuesta</p>
<p class="barra-nota__sub" id="nota-sub">Solicitud de Interferencias</p>
</div>
<div class="botonera" style="gap:10px">
<a class="boton boton--claro boton--chico" id="nota-volver" href="seguimiento.html"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M15 5 L8 12 L15 19"></path></svg>Volver al estado del trámite</a>
<button class="boton boton--verde boton--chico solo-local" type="button" id="nota-imprimir"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M12 4 V15"></path><path d="M7.5 10.5 L12 15 L16.5 10.5"></path><path d="M5 20 H19"></path></svg>Descargar o imprimir (PDF)</button>
</div>
</div>
</div>

<main class="papel" id="nota" tabindex="-1">
<noscript><p class="recuadro recuadro--alerta" style="max-width:794px;margin:0 auto">Para ver la nota necesitás tener JavaScript activado en el navegador.</p></noscript>
</main>

<script src="js/comun.js"></script>
<script src="js/datos.js"></script>
<script>
(function () {
  'use strict';
  var E = window.EPEN;
  E.alIniciar(function () {
    var caja = document.getElementById('nota');
    var t = E.datos.obtener(E.param('n') || 'INT 142/26');
    var desdeBandeja = E.param('desde') === 'bandeja';
    var volver = document.getElementById('nota-volver');
    var url = t ? '?n=' + encodeURIComponent(E.numeroAUrl(t.numero)) : '';
    if (desdeBandeja) {
      volver.href = 'bandeja.html' + url;
      volver.lastChild.textContent = 'Volver a la bandeja';
    } else {
      volver.href = 'seguimiento.html' + url;
    }

    if (!t || t.estado !== 'respondida') {
      document.getElementById('nota-imprimir').hidden = true;
      caja.insertAdjacentHTML('beforeend',
        '<div class="recuadro recuadro--borde" style="max-width:794px;margin:0 auto">' +
        '<h1 style="margin:0 0 10px;font-size:24px;font-weight:800">' + (t ? 'Esta solicitud todavía no tiene nota de respuesta' : 'No encontramos ese trámite') + '</h1>' +
        '<p>' + (t ? 'Cuando el Sector Técnico responda, la nota va a estar disponible acá y te avisamos por correo.' : 'Revisá el número de trámite o consultalo desde el seguimiento.') + '</p>' +
        '<p style="margin-top:14px"><a class="boton boton--verde boton--chico" href="seguimiento.html' + url + '">Ir al estado del trámite</a></p></div>');
      return;
    }

    var r = t.respuesta;
    document.title = 'Nota S.T. S.E.V.L.A. N° ' + r.notaNumero + ' · ' + t.numero + ' | EPEN';
    document.getElementById('nota-sub').textContent = 'Solicitud de Interferencias, trámite ' + t.numero;
    caja.insertAdjacentHTML('beforeend', E.nota.html(t, { numero: r.notaNumero, fecha: r.fecha, resultados: r.resultados }));

    if (r.plano) {
      var detalle = r.plano.detalle || (E.extension(r.plano.nombre).toUpperCase() + (r.plano.bytes ? ', ' + E.tam(r.plano.bytes) : ''));
      caja.insertAdjacentHTML('beforeend',
        '<div class="adjunto-nota">' + E.icono.archivo.replace('width="20" height="20"', 'width="22" height="22"') +
        '<span><strong>Adjunto:</strong> plano de interferencias del trámite ' + E.esc(t.numero) + ' (' + E.esc(detalle) + ')</span>' +
        '<button class="boton boton--borde boton--chico" type="button" id="ver-plano">Ver el plano</button></div>');
      document.getElementById('ver-plano').addEventListener('click', function () {
        if (r.plano.id) E.archivos.abrir(r.plano.id, r.plano.nombre);
        else E.avisar('El plano de este trámite de ejemplo no es un archivo real. En la versión final se abre el PDF.');
      });
    }
    document.getElementById('nota-imprimir').addEventListener('click', function () { window.print(); });
  });
})();
</script>
<script>(function(){var p='Prototipo · ',el=document.querySelector('title');function f(){if(document.title.indexOf(p)!==0)document.title=p+document.title;}f();if(el)new MutationObserver(f).observe(el,{childList:true,characterData:true,subtree:true});})();</script>
</body>
</html>
